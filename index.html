function pickInitialLang() {
  try {
    const saved = localStorage.getItem('kimnews_lang');
    if (saved && STRINGS[saved]) return saved;
    const nav = (navigator.language || 'ko').slice(0, 2).toLowerCase();
    if (STRINGS[nav]) return nav;
  } catch {}
  return 'ko';
}

function useLang() {
  const [lang, setLangState] = useState(pickInitialLang);
  const setLang = (v) => {
    if (!STRINGS[v]) return;
    setLangState(v);
    try { localStorage.setItem('kimnews_lang', v); } catch {}
    try { document.documentElement.lang = v; } catch {}
  };
  return [lang, setLang, STRINGS[lang]];
}

// Localized item — prefer language-specific title/content when present.
function localizeItem(item, lang) {
  return {
    ...item,
    title: item[`title_${lang}`] || item.title,
    content: item[`content_${lang}`] || item.content,
  };
}

function useFeed() {
  const [data, setData] = useState(null);
  const [err, setErr] = useState('');
  useEffect(() => {
    fetch('data/latest.json', { cache: 'no-store' })
      .then(r => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))
      .then(setData)
      .catch(e => setErr(e.message));
  }, []);
  return { data, err };
}

function formatIssue(iso, t) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  const date = new Date(Date.UTC(y, m-1, d));
  return t.formatDate(y, m, d, t.dows[date.getUTCDay()]);
}

function relativeTime(iso, nowMs, t) {
  if (!iso || !t) return '';
  const ts = Date.parse(iso);
  if (Number.isNaN(ts)) return '';
  const now = nowMs || Date.now();
  const diffMs = now - ts;
  if (diffMs < -60_000) return t.scheduled;
  if (diffMs < 60_000) return t.justNow;
  const mins = Math.floor(diffMs / 60000);
  if (mins < 60) return `${mins}${t.minSuffix}`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}${t.hrSuffix}`;
  const days = Math.floor(hrs / 24);
  if (days < 7) return `${days}${t.daySuffix}`;
  const d = new Date(ts);
  return `${d.getMonth()+1}.${d.getDate()}`;
}

function absoluteTime(iso) {
  if (!iso) return '';
  const t = Date.parse(iso);
  if (Number.isNaN(t)) return iso;
  const d = new Date(t);
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// Re-render once per minute so relative labels stay fresh while the tab is open.
function useNow(intervalMs = 60_000) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), intervalMs);
    return () => clearInterval(id);
  }, [intervalMs]);
  return now;
}

function LanguageSwitcher({ lang, setLang }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    if (!open) return;
    const onDown = (e) => { if (!ref.current?.contains(e.target)) setOpen(false); };
    const onKey  = (e) => { if (e.key === 'Escape') setOpen(false); };
    document.addEventListener('mousedown', onDown);
    document.addEventListener('keydown', onKey);
    return () => {
      document.removeEventListener('mousedown', onDown);
      document.removeEventListener('keydown', onKey);
    };
  }, [open]);

  const current = LANGS.find(l => l.value === lang) || LANGS[1];

  return (
    <div ref={ref} style={{ position: 'relative' }}>
      <button
        onClick={() => setOpen(o => !o)}
        type="button"
        aria-haspopup="listbox"
        aria-expanded={open}
        style={{
          display: 'inline-flex', alignItems: 'center', gap: 8,
          background: ACCENT.ink, color: '#fbf5e6',
          border: 'none', borderRadius: 999,
          padding: '7px 12px 7px 14px',
          fontSize: 13, fontWeight: 600, fontFamily: 'inherit',
          cursor: 'pointer', letterSpacing: '-0.01em',
        }}
      >
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
          <path d="M2 12h20" />
          <path d="M12 2a15 15 0 0 1 0 20a15 15 0 0 1 0-20z" />
        </svg>
        <span>{current.code}</span>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" style={{ marginLeft: -2 }}>
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </button>

      {open && (
        <div
          role="listbox"
          style={{
            position: 'absolute', top: 'calc(100% + 8px)', right: 0,
            background: ACCENT.ink, color: '#fbf5e6',
            borderRadius: 14, padding: 6, minWidth: 200,
            boxShadow: '0 16px 40px -12px rgba(31,61,18,0.45), 0 0 0 1px rgba(255,255,255,0.04) inset',
            zIndex: 60,
            animation: 'fadeUp 0.16s ease both',
          }}
        >
          {LANGS.map(opt => {
            const isCurrent = opt.value === lang;
            return (
              <button
                key={opt.value}
                onClick={() => { setLang(opt.value); setOpen(false); }}
                type="button"
                role="option"
                aria-selected={isCurrent}
                style={{
                  width: '100%', textAlign: 'left',
                  display: 'flex', alignItems: 'center', gap: 14,
                  padding: '10px 12px',
                  background: isCurrent ? 'rgba(231,227,183,0.10)' : 'transparent',
                  border: 'none', borderRadius: 10,
                  color: '#fbf5e6', cursor: 'pointer', fontFamily: 'inherit',
                  transition: 'background 0.15s',
                }}
                onMouseEnter={(e) => { if (!isCurrent) e.currentTarget.style.background = 'rgba(231,227,183,0.06)'; }}
                onMouseLeave={(e) => { if (!isCurrent) e.currentTarget.style.background = 'transparent'; }}
              >
                <span style={{ color: '#c8d8a8', fontWeight: 700, fontSize: 13, letterSpacing: '0.04em', width: 24 }}>{opt.code}</span>
                <span style={{ fontSize: 14, fontWeight: isCurrent ? 600 : 500 }}>{opt.label}</span>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function Nav({ lang, setLang }) {

      </div>

        <LanguageSwitcher lang={lang} setLang={setLang} />
        <a href="https://kimkim.io" style={{ fontSize: 14, color: '#fff', background: ACCENT.ink, padding: '8px 14px', borderRadius: 8, textDecoration: 'none', fontWeight: 500 }}>kimkim.io ↗</a>

function Banner({ data, now, t }) {
  const issue = data?.issue_date;
  const generated = data?.generated_at;
  const fresh = generated ? relativeTime(generated, now, t) : '';
  return (
    <header className="section" style={{ maxWidth: 1240, margin: '0 auto', padding: '8px 32px 24px' }}>
      <div style={{ display: 'inline-flex', alignItems: 'center', gap: 8, padding: '5px 11px', borderRadius: 999, background: ACCENT.soft, color: ACCENT.hex, fontSize: 11, fontWeight: 500, marginBottom: 12, letterSpacing: '-0.01em' }}>
        <span style={{ width: 6, height: 6, borderRadius: '50%', background: ACCENT.hex, animation: 'pulse-dot 2s ease-in-out infinite' }} />

      </div>
      <h1 className="headline" style={{ fontSize: 52, fontWeight: 700, lineHeight: 1.05, letterSpacing: '-0.035em', margin: 0, color: '#1a3010' }}>
        {t.titleA} <span style={{ color: ACCENT.hex }}>{t.titleB}</span>
      </h1>
      <div style={{ display: 'flex', gap: 16, marginTop: 14, fontSize: 13, color: TEXT_MUTED, flexWrap: 'wrap' }}>
        {issue && <span><strong style={{ color: ACCENT.ink, fontWeight: 600 }}>{formatIssue(issue, t)}</strong> {t.todayLabel}</span>}
        {data?.count != null && <span>· {t.count(data.count)}</span>}
        {fresh && <span>· {t.updated(fresh)}</span>}
      </div>
    </header>
  );
}

function CategoryTabs({ active, onChange, counts, t }) {
  const ids = ['all', 'AI', 'TECH', 'DEV', 'youtube'];
  return (
    <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 18 }}>
      {ids.map(id => {
        const isActive = id === active;
        const n = counts?.[id];
        return (
          <button
            key={id}
            onClick={() => onChange(id)}
            className={`chip-tab ${isActive ? 'active' : ''}`}
            style={{
              padding: '8px 14px', borderRadius: 999, fontSize: 13, fontWeight: 500, fontFamily: 'inherit',
              border: `1px solid ${isActive ? ACCENT.hex : BORDER}`,
              background: isActive ? ACCENT.hex : '#fff',
              color: isActive ? '#fff' : '#1f2412',
              cursor: 'pointer',
            }}
          >
            {t.cats[id]}
            {n != null && <span style={{ marginLeft: 6, fontSize: 11, opacity: isActive ? 0.85 : 0.5 }}>{n}</span>}
          </button>
        );
      })}
    </div>
  );
}

  const isYT = kind === 'youtube';
  return (

        </svg>
      )}
      {source}
    </div>
  );
}

function NewsCard({ item, onOpen, now, t }) {
  const isYT = item.kind === 'youtube';
  const cardStyle = {
    display: 'flex', flexDirection: 'column', gap: 8,
    background: '#fff', border: `1px solid ${BORDER}`, borderRadius: 16,
    padding: '16px 18px', textDecoration: 'none', color: 'inherit',
    cursor: 'pointer',
  };

  // YouTube items still open YouTube directly (target=_blank).
  // Articles open the in-app reader so users stay on kimnews.
  const inner = (
    <>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8 }}>
        <SourceBadge source={item.source} kind={item.kind} />
        {item.published && (
          <span style={{ fontSize: 11, color: TEXT_FAINT }} title={absoluteTime(item.published)}>
            {relativeTime(item.published, now, t)}
          </span>
        )}
      </div>
      <div style={{ fontSize: 15, fontWeight: 600, lineHeight: 1.4, color: '#1f2412', letterSpacing: '-0.01em' }}>
        {item.title}
      </div>
      {item.summary && (
        <div style={{ fontSize: 13, color: TEXT_MUTED, lineHeight: 1.55,
          display: '-webkit-box', WebkitLineClamp: 3, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>
          {item.summary}
        </div>
      )}
      <div style={{ marginTop: 'auto', paddingTop: 4, fontSize: 11, color: ACCENT.hex, fontWeight: 600, letterSpacing: '-0.01em' }}>
        {isYT ? t.play : t.read}
      </div>
    </>
  );

  if (isYT) {
    return (
      <a href={item.link} target="_blank" rel="noopener noreferrer" className="news-card" style={cardStyle}>
        {inner}
      </a>
    );
  }
  return (
    <button type="button" onClick={() => onOpen(item)} className="news-card" style={{ ...cardStyle, textAlign: 'left', fontFamily: 'inherit' }}>
      {inner}
    </button>
  );
}

function ArticleReader({ item, onClose, now, t }) {
  useEffect(() => {
    if (!item) return;
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.body.style.overflow = 'hidden';
    window.addEventListener('keydown', onKey);
    return () => {
      document.body.style.overflow = '';
      window.removeEventListener('keydown', onKey);
    };
  }, [item, onClose]);
  if (!item) return null;
  const paragraphs = (item.content || item.summary || '').split(/\n{2,}/).filter(Boolean);
  return (
    <div
      onClick={onClose}
      style={{ position: 'fixed', inset: 0, background: 'rgba(31,60,18,0.55)', backdropFilter: 'blur(6px)', zIndex: 100, display: 'flex', alignItems: 'flex-start', justifyContent: 'center', padding: '40px 20px', overflowY: 'auto', animation: 'fadeUp 0.2s ease' }}
    >
      <article
        onClick={(e) => e.stopPropagation()}
        style={{ background: '#fff', borderRadius: 22, maxWidth: 720, width: '100%', padding: '28px 32px 32px', boxShadow: '0 40px 80px -20px rgba(31,61,18,0.40)', position: 'relative' }}
      >
        <button
          onClick={onClose}
          aria-label="닫기"
          style={{ position: 'absolute', top: 14, right: 16, background: 'transparent', border: 'none', fontSize: 22, lineHeight: 1, color: TEXT_FAINT, cursor: 'pointer', padding: 6, fontFamily: 'inherit' }}
        >×</button>

        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14, flexWrap: 'wrap' }}>
          <SourceBadge source={item.source} kind={item.kind} />
          {item.published && (
            <span style={{ fontSize: 11, color: TEXT_FAINT }} title={absoluteTime(item.published)}>
              {relativeTime(item.published, now, t)}
            </span>
          )}
          {item.paraphrased && (
            <span style={{ fontSize: 10, color: ACCENT.hex, fontWeight: 600, padding: '2px 8px', borderRadius: 999, background: ACCENT.soft, letterSpacing: '0.04em' }}>
              {t.summary}
            </span>
          )}
        </div>

        <h2 style={{ margin: 0, fontSize: 24, fontWeight: 700, lineHeight: 1.3, letterSpacing: '-0.02em', color: '#1a3010' }}>
          {item.title}
        </h2>

        <div style={{ marginTop: 18, fontSize: 15, lineHeight: 1.75, color: '#22321a' }}>
          {paragraphs.length ? paragraphs.map((p, i) => (
            <p key={i} style={{ margin: '0 0 14px' }}>{p}</p>
          )) : (
            <p style={{ color: TEXT_MUTED }}>{t.noPreview}</p>
          )}
        </div>

        <div style={{ marginTop: 22, paddingTop: 18, borderTop: `1px solid ${BORDER}`, display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 12 }}>
          <div style={{ fontSize: 12, color: TEXT_FAINT, lineHeight: 1.6 }}>
            {t.sourceLabel}: <strong style={{ color: ACCENT.ink, fontWeight: 600 }}>{item.source}</strong>
            {item.paraphrased && <> · {t.paraphraseNote}</>}
          </div>
          <a
            href={item.link}
            target="_blank"
            rel="noopener noreferrer"
            style={{ background: ACCENT.hex, color: '#fff', padding: '9px 16px', borderRadius: 10, fontSize: 13, fontWeight: 600, textDecoration: 'none', whiteSpace: 'nowrap' }}
          >{t.original}</a>
        </div>
      </article>
    </div>
  );
}

function App() {
  const { data, err } = useFeed();
  const [active, setActive] = useState('all');
  const [openItem, setOpenItem] = useState(null);
  const now = useNow();
  const [lang, setLang, t] = useLang();

  const rawItems = data?.items || [];
  const items = useMemo(() => rawItems.map(it => localizeItem(it, lang)), [rawItems, lang]);

  const counts = useMemo(() => ({
    all: items.length,
    AI: items.filter(i => i.category === 'AI').length,
    TECH: items.filter(i => i.category === 'TECH').length,
    DEV: items.filter(i => i.category === 'DEV').length,
    youtube: items.filter(i => i.kind === 'youtube').length,
  }), [items]);

  const filtered = useMemo(() => {
    if (active === 'all') return items;
    if (active === 'youtube') return items.filter(i => i.kind === 'youtube');
    return items.filter(i => i.category === active);
  }, [items, active]);

  return (
    <div style={{ minHeight: '100vh', background: BG, color: '#1f2412' }}>
      <Nav lang={lang} setLang={setLang} />
      <Banner data={data} now={now} t={t} />
      <ArticleReader item={openItem} onClose={() => setOpenItem(null)} now={now} t={t} />

      <main className="section" style={{ maxWidth: 1240, margin: '0 auto', padding: '8px 32px 60px' }}>
        <CategoryTabs active={active} onChange={setActive} counts={counts} t={t} />

        {err ? (
          <div style={{ background: '#fff', border: `1px solid ${BORDER}`, borderRadius: 16, padding: 24, color: '#c54433', fontSize: 14 }}>
            {t.notReady} ({err})
          </div>
        ) : !data ? (
          <div className="news-grid">
            {Array.from({ length: 9 }).map((_, i) => (
              <div key={i} className="shimmer" style={{ height: 180, borderRadius: 16 }} />
            ))}
          </div>
        ) : filtered.length === 0 ? (
          <div style={{ background: '#fff', border: `1px dashed ${BORDER}`, borderRadius: 16, padding: 32, textAlign: 'center', color: TEXT_MUTED, fontSize: 14 }}>
            {t.empty}
          </div>
        ) : (
          <div className="news-grid" style={{ animation: 'fadeUp 0.4s ease both' }}>
            {filtered.map(it => <NewsCard key={it.id} item={it} onOpen={setOpenItem} now={now} t={t} />)}
          </div>
        )}
      </main>

      <footer style={{ borderTop: `1px solid ${BORDER}`, padding: '24px 32px', maxWidth: 1240, margin: '0 auto', display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 12, color: TEXT_FAINT, flexWrap: 'wrap', gap: 10 }}>
        <div>{t.footer}</div>
        <div style={{ display: 'flex', gap: 18 }}>
          <a href="https://kimkim.io" style={{ color: TEXT_FAINT, textDecoration: 'none' }}>kimkim.io</a>
          <a href="https://github.com/geonhee15/kimnews" style={{ color: TEXT_FAINT, textDecoration: 'none' }}>GitHub</a>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

name: Aggregate

on:
  schedule:
    # Every 15 minutes. GitHub's scheduler granularity is 5 min; under
    # heavy load runs can drift a few minutes — acceptable for news.
    - cron: "*/15 * * * *"
  workflow_dispatch:        # manual trigger from Actions tab
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write

# Avoid stomping when a previous run is still going. If one is mid-flight
# the new one queues, and we cancel any older queued (not running) duplicate.
concurrency:
  group: aggregate
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run aggregator
        run: python scripts/aggregate.py

      - name: Commit & push if changed
        run: |
          git config user.name  "kimnews-bot"
          git config user.email "noreply@kimkim.io"
          git add data/
          if git diff --staged --quiet; then
            echo "no changes to commit"
          else
            COUNT=$(python -c "import json; print(json.load(open('data/latest.json'))['count'])")
            git commit -m "update: ${COUNT}건 갱신 (#${{ github.run_number }})"
            # Avoid push race when another job committed in between
            git pull --rebase origin main || true
            git push
          fi
